name:
  gem: hanami-cli
  constant: Hanami::CLI
  title: Hanami CLI
github_org: hanami
ci:
  matrix:
    rack: ["~> 2.0", "~> 3.0"]
  jruby: false
gemspec:
  authors: ["Hanakai team"]
  email: ["info@hanakai.org"]
  summary: "The CLI for the Hanami framework"
  homepage: "https://hanamirb.org"
  runtime_dependencies:
    - ["bundler", ">= 2.1"]
    - ["dry-cli", "~> 1.0", ">= 1.4.0"]
    - ["dry-files", "~> 1.0", ">= 1.0.2"]
    - ["dry-inflector", "~> 1.0"]
    - ["irb"]
    - ["rake", "~> 13.0"]
    - ["zeitwerk", "~> 2.6"]
    - ["rackup"]
