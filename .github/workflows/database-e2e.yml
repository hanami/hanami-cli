name: Database E2E

on:
  push:
    branches: ["main", "release-*", "ci/*"]
  pull_request:
    branches: ["main", "release-*"]

permissions:
  contents: read

jobs:
  database-e2e:
    name: Database E2E (${{ matrix.db }}, Ruby 4.0)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # NOTE: database names carry the `_test` suffix already: with HANAMI_ENV=test, Hanami
        # maps every database URL through Hanami::DB::Testing.database_url, which appends `_test`
        # (a no-op when the name is suffixed already). Pre-suffixing keeps DATABASE_URL and the
        # asserted names 1:1 instead of relying on the mapping implicitly.
        include:
          - db: sqlite
            database_flag: sqlite
            database_url: sqlite://db/sqlite_e2e_test.sqlite
            db_name: db/sqlite_e2e_test.sqlite
            db_file: db/sqlite_e2e_test.sqlite
          - db: mysql
            database_flag: mysql
            database_url: mysql2://root:password@127.0.0.1:3307/mysql_e2e_test
            db_name: mysql_e2e_test
            db_port: "3307"
          - db: mariadb
            database_flag: mysql
            database_url: mysql2://root:password@127.0.0.1:3308/mariadb_e2e_test
            db_name: mariadb_e2e_test
            db_port: "3308"
          - db: postgres
            database_flag: postgres
            database_url: postgres://postgres:password@127.0.0.1:5432/postgres_e2e_test
            db_name: postgres_e2e_test
    env:
      HANAMI_ENV: test
      DATABASE_URL: ${{ matrix.database_url }}
      E2E_DB: ${{ matrix.db }}
      E2E_DATABASE_FLAG: ${{ matrix.database_flag }}
      E2E_DB_NAME: ${{ matrix.db_name }}
      E2E_DB_PORT: ${{ matrix.db_port }}
      E2E_DB_FILE: ${{ matrix.db_file }}
    services:
      mysql:
        image: mysql:9.6.0
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: password
        ports:
          - 3308:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          persist-credentials: false
      - name: Install database client
        run: |
          case "${{ matrix.db }}" in
            mysql)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends mysql-client libmysqlclient-dev
              mysql --version
              mysqldump --version
              ;;
            mariadb)
              sudo apt-get update
              sudo apt-get remove -y 'mysql-client*' || true
              sudo apt-get install -y --no-install-recommends mariadb-client libmariadb-dev
              mysql --version
              mysqldump --version
              ;;
            postgres)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends postgresql-client libpq-dev
              psql --version
              pg_dump --version
              ;;
            sqlite)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends sqlite3 libsqlite3-dev
              sqlite3 --version
              ;;
          esac
      - name: Set up Ruby
        uses: ruby/setup-ruby@0cb964fd540e0a24c900370abf38a33466142735 # zizmor: ignore[cache-poisoning]
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Run database E2E script
        run: bash .github/workflows/database-e2e.sh
